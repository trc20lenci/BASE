name: base_app
description: "BASE — мобильное приложение для монтажа видео (MVP)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Backend — Supabase (Auth, PostgreSQL Database, Storage)
  supabase_flutter: ^2.8.0

  # Рендер финального MP4 — см. VideoExportEngine/FfmpegExportEngine.
  # Выбран "video"-флейвор (dav1d/libvpx/fontconfig/freetype — декод AV1/
  # VP9/WebP + поддержка drawtext), БЕЗ GPL-кодеков (нет libx264/libx265).
  # Кодирование видео поэтому идёт через libvpx-vp9 (LGPL, включён в этот
  # флейвор), а не H.264 — см. подробности в FfmpegExportEngine.
  ffmpeg_kit_flutter_new_video: ^2.5.2

  # Навигация
  go_router: ^14.2.7

  # Работа с медиа (импорт из галереи)
  image_picker: ^1.1.2
  photo_manager: ^3.6.4
  video_player: ^2.9.2
  file_picker: ^8.1.2

  # Локальный доступ к файлам проекта / экспорт в галерею
  path_provider: ^2.1.4
  gal: ^2.3.0 # сохранение экспортированного видео в галерею устройства

  # Модель проекта / value equality
  equatable: ^2.0.5
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0

  # Иконки/шрифты
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  # Единственный встроенный шрифт приложения (согласно ТЗ — без доп. шрифтов
  # в текстовом инструменте редактора; здесь — шрифт интерфейса).
  # Файл шрифта нужно добавить в assets/fonts/ (см. README раздел "Шрифты").
  # fonts:
  #   - family: BaseSans
  #     fonts:
  #       - asset: assets/fonts/BaseSans-Regular.ttf
  #       - asset: assets/fonts/BaseSans-Medium.ttf
  #         weight: 500
